# Source of truth for README.md. Edit this file, then run: python scripts/build_readme.py
# See CONTRIBUTING.md for the field rules. Entry order here does not matter.

# Top-level README sections, in order. Each category belongs to one group.
groups:
  - id: wsp
    title: Weight-Space Programming
    description: Language models and agents that read, edit, or write the weights of other networks (or their own) directly, guided by a goal in natural language rather than by gradient descent.
  - id: foundations
    title: Foundations and Related Areas
    description: Older lines of work that treat weights as objects to compute, compose, learn from, or read, and that weight-space programming builds on.
  - id: resources
    title: Resources
    description: Benchmarks, datasets, tools, model zoos, and surveys.

# Subsections, in README order.
categories:
  - id: wsp-reading
    group: wsp
    title: Reading Weights
    description: Models that inspect another network's weights or weight diffs and say what the network does.
  - id: wsp-editing
    group: wsp
    title: Editing and Repairing Models
    description: An LLM or agent changes an existing network's weights to fix a failure or change a behaviour.
  - id: wsp-writing
    group: wsp
    title: Writing Weights from Scratch
    description: An LLM writes all the weights of a network, or installs a new capability, from a specification instead of training.
  - id: wsp-self-editing
    group: wsp
    title: Self-Editing Models
    description: Models that produce updates to their own weights.
  - id: wsp-critiques
    group: wsp
    title: Replications, Critiques and Alternatives
    description: Independent replications, tests of what the reading and writing really rely on, and non-LLM alternatives to the same edits.
  - id: wsp-security
    group: wsp
    title: Security
    description: Using weight-space programming to implant backdoors, and the risks this creates.
  - id: model-editing
    group: foundations
    title: Model and Knowledge Editing
    description: Methods that change specific facts or behaviours by computing or learning a targeted weight update.
  - id: editing-analysis
    group: foundations
    title: Analyses of Weight Edits
    description: Work on what weight edits look like and how they fail, including rank-one structure, locality, side effects, and collapse under many edits.
  - id: task-arithmetic-merging
    group: foundations
    title: Task Vectors, Task Arithmetic and Model Merging
    description: Treating fine-tuning deltas as vectors to add, negate, and combine, and merging trained models directly in weight space.
  - id: weight-space-learning
    group: foundations
    title: Weight-Space Learning
    description: Networks that take other networks' weights as input, including equivariant metanetworks, neural functionals, and weight embeddings.
  - id: weight-generation
    group: foundations
    title: Weight Generation
    description: Hypernetworks and generative models (diffusion, flow matching, autoregressive) that output network weights, including prompt-to-weights and text-to-LoRA.
  - id: weight-interpretability
    group: foundations
    title: Weight-Based Interpretability
    description: Reading what a network computes directly from its parameters, including parameter decomposition and circuit-level weight edits.
  - id: benchmarks-datasets
    group: resources
    title: Benchmarks, Datasets, Tools and Model Zoos
    description: Evaluation suites for weight-space programming, weight edits and merges, software for manipulating weights, and collections of trained networks for weight-space research.
  - id: surveys
    group: resources
    title: Surveys and Position Papers
    description: Overviews of one or more of these areas.

